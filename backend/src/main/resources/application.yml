spring:
  application:
    name: ewidencja-zwrotow
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/returns}
    username: ${SPRING_DATASOURCE_USERNAME:returns}
    password: ${SPRING_DATASOURCE_PASSWORD:returns}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Warsaw
  flyway:
    encoding: UTF-8
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6381}
  jackson:
    time-zone: Europe/Warsaw
    default-property-inclusion: non_null
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 12h
      cookie:
        same-site: lax
        http-only: true
        name: RETURNSSESSION

app:
  encryption-key: ${APP_ENCRYPTION_KEY:dev-only-change-me-please-32b}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4201}
  user-agent: Returns-Ewidencja/1.0.0
